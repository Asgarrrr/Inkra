<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkra</title>
    <script>
      (function () {
        var d = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- Runs before the module graph is fetched, so `entry-eval` minus this mark
         is the cost of parsing and evaluating the entry chunk itself. A mark
         inside main.tsx cannot see that: its own imports are hoisted above it. -->
    <script>
      performance.mark("startup:document-ready");
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
