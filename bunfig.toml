# The suite must be run as `bun run test`, which is `bun test --isolate`.
#
# `--isolate` decides pass/fail, not speed: a bare `bun test` is 661 pass / 41
# fail. Three pieces of state outlive a test file and leak into the next one —
# `mock.module`'s registry is process-global, `globalStubs` in
# `tests/helpers/vi-compat.ts` is a module singleton, and
# `tests/helpers/actual-tauri-core.ts` snapshots `@tauri-apps/api/core` at its
# first import for the whole run. One fresh global per file is what contains
# them. Bun has no bunfig key for isolation — an `isolate` key here is silently
# ignored, verified against 1.4.0 — so the flag lives in the root `test` script.

[test]
pathIgnorePatterns = ["apps/desktop/e2e/**"]
